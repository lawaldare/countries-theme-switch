<nav class="navbar" [ngClass]="{ 'dark-mode': this.countryService.isDark() }">
  <div class="container">
    <a class="navbar-brand mode" (click)="goToHomepage()"
      >Where in the world?</a
    >
    <p class="mode mt-3" (click)="changeMode()">
      @if (this.countryService.isDark()) {
        <i class="fas fa-moon"></i>
      }
      @if (!this.countryService.isDark()) {
        <i class="far fa-moon"></i>
      }
      &nbsp; Dark Mode
    </p>
  </div>
</nav>
